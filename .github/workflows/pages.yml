name: Publicar no GitHub Pages

# Push na main publica aesolar.com.br em poucos minutos, sem aprovação.
# O site é o HTML pronto da pasta site/, gerado por gerador/gera_site.py a partir de gerador/dados.json.
# Aqui nada é gerado: só se confere que site/ bate com a fonte e passa nas travas de produção, e se publica.
# O domínio (aesolar.com.br) está nas configurações do Pages do repositório, não neste arquivo.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node (os testes rodam o simulador.js de verdade)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Recusa publicar se site/ não bate com a fonte, se a prévia está ligada, se sobrou marca PENDENTE,
      # imagem provisória ou formulário em modo "simulado".
      - name: Conferência de produção
        run: python3 gerador/gera_site.py --producao

      - name: Testes do gerador
        run: python3 gerador/teste_gerador.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
